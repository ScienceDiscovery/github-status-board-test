name: Collect dashboard data
run-name: Collect dashboard (${{ inputs.request_id || 'manual' }})
on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Source repository; must match this dashboard's configured source
        type: string
        required: false
      request_id:
        description: Bot refresh identifier
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: collect-${{ github.repository }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and destination
        id: context
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          COLLECTION_REQUEST_ID: ${{ inputs.request_id }}
        run: python3 collection_context.py
      - name: Create source read token
        id: source
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SDBOT_GITHUB_APP_ID }}
          private-key: ${{ secrets.SDBOT_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.context.outputs.source_owner }}
          repositories: ${{ steps.context.outputs.source_name }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-actions: read
          permission-checks: read
          permission-statuses: read
      - name: Create dashboard write token
        id: target
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SDBOT_GITHUB_APP_ID }}
          private-key: ${{ secrets.SDBOT_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.context.outputs.target_owner }}
          repositories: ${{ steps.context.outputs.target_name }}
          permission-contents: write
      - name: Collect and commit site snapshot
        env:
          GITHUB_TOKEN: ${{ steps.source.outputs.token }}
          GSB_PUBLISH_TOKEN: ${{ steps.target.outputs.token }}
          SOURCE_REPOSITORY: ${{ steps.context.outputs.source }}
          TARGET_REPOSITORY: ${{ steps.context.outputs.target }}
        run: python3 publish.py --repo "$SOURCE_REPOSITORY" --publish-repo "$TARGET_REPOSITORY" --output .tmp/collected-site
      # The App-authored site commit triggers pages.yml. Do not replace the write
      # token with GITHUB_TOKEN: its push would not trigger that second workflow.
