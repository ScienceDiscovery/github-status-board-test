<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub 状态看板</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-title">GitHub 状态看板</span>
    <a id="repo-link" class="repo-link" href="#" target="_blank" rel="noopener">—</a>
  </div>
  <nav class="tabs" id="tabs" aria-label="看板页面">
    <a href="#overview" data-tab="overview">总览</a>
    <a href="#board" data-tab="board">看板</a>
    <a href="#issues" data-tab="issues">Issue</a>
    <a href="#prs" data-tab="prs">PR</a>
    <a href="#ci" data-tab="ci">CI</a>
    <a href="#tests" data-tab="tests">测试</a>
    <a href="#coverage" data-tab="coverage">Coverage</a>
    <a href="#ops" data-tab="ops">运维</a>
    <a href="#quality" data-tab="quality">构建报告</a><a href="#releases" data-tab="releases">版本验证</a>
    <a href="#history" data-tab="history">历史数据</a>
  </nav>
  <div class="topbar-status">
    <div class="meta"><span>快照更新于</span><time id="meta">载入中…</time></div>
    <button id="refresh-btn" class="btn primary" type="button">刷新视图</button>
  </div>
</header>

<div id="global-banner" class="banner hidden"></div>

<main id="main">
  <section id="tab-overview" class="tab"></section>
  <section id="tab-board" class="tab"></section>
  <section id="tab-issues" class="tab"></section>
  <section id="tab-prs" class="tab"></section>
  <section id="tab-ci" class="tab"></section>
  <section id="tab-tests" class="tab"></section>
  <section id="tab-coverage" class="tab"></section>
  <section id="tab-ops" class="tab"></section>
  <section id="tab-quality" class="tab"></section><section id="tab-releases" class="tab"></section>
  <section id="tab-history" class="tab"></section>
</main>


<aside id="drawer" class="drawer hidden" aria-label="卡片详情"></aside>
<dialog id="board-settings" class="settings"></dialog>
<div id="tooltip" class="tooltip hidden"></div>
<dialog id="test-detail" aria-labelledby="detail-title"><div class="dialog-head"><h2 id="detail-title"></h2><button id="close-detail" class="btn" type="button">关闭</button></div><div id="detail-body"></div></dialog>
<script src="./history.js"></script><script src="./report.js"></script><script src="./board-local.js"></script><script src="./app.js"></script>
<script src="./board.js"></script>
</body>
</html>
